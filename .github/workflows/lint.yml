name: Run lint and format checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v3
    - name: Install runtime tools
      run: |
        pip install --only-binary :all: ruff==0.15.22
    - name: Lint with ruff
      run: |
        ruff check --target-version py311
    - name: Check format with ruff
      run: |
        ruff format --check --diff --target-version py311
